<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Bomber Arena: Blast Rush</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1020;color:#fff;font-family:Arial,sans-serif;display:flex;justify-content:center;min-height:100vh}
.wrap{width:min(1000px,100%);padding:16px;text-align:center}
h1{margin:5px 0;color:#ffd84d;text-shadow:0 3px #b34b00}
.info{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.badge{background:#17213b;border:1px solid #34466f;border-radius:10px;padding:8px 12px}
canvas{width:min(720px,96vw);height:auto;border:4px solid #334d7d;border-radius:12px;background:#111;image-rendering:pixelated;box-shadow:0 10px 30px #0008}
.controls{margin:12px auto;max-width:620px;display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
button{border:0;border-radius:9px;padding:12px;background:#24365f;color:#fff;font-weight:bold;cursor:pointer}
button:hover{background:#34518d}
.help{font-size:14px;color:#cbd5f0;line-height:1.5}
#message{min-height:24px;color:#ffd84d;font-weight:bold}
</style>
</head>
<body>
<div class="wrap">
<h1>💣 BOMBER ARENA: BLAST RUSH</h1>
<div class="info">
 <div class="badge">❤️ Nyawa: <span id="lives">3</span></div>
 <div class="badge">💣 Bom: <span id="bombs">1</span></div>
 <div class="badge">💥 Radius: <span id="radius">1</span></div>
 <div class="badge">⭐ Skor: <span id="score">0</span></div>
 <div class="badge">🏆 Level: <span id="level">1</span>/10</div>
</div>
<canvas id="game" width="720" height="520"></canvas>
<div id="message">Hancurkan semua musuh dan capai portal hijau!</div>
<div class="controls">
 <button onclick="move(0,-1)">⬆️</button>
 <button onclick="plantBomb()">💣 BOM</button>
 <button onclick="move(0,1)">⬇️</button>
 <button onclick="move(-1,0)">⬅️</button>
 <button onclick="restart()">🔄 ULANG</button>
 <button onclick="move(1,0)">➡️</button>
</div>
<div class="help">
<b>Keyboard:</b> WASD / tombol panah = bergerak · Spasi = bom · R = ulang<br>
Hancurkan peti untuk menemukan power-up. Jangan berada di jalur ledakan!
</div>
</div>

<script>
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");
const COLS=13, ROWS=9, TILE=40, OX=100, OY=80;
let level=1,lives=3,score=0,radius=1,maxBombs=1,bombsActive=0;
let map=[], enemies=[], bombs=[], powers=[], player, portal, gameState="playing";
let last=0;

const dirs=[[1,0],[-1,0],[0,1],[0,-1]];

function cell(x,y){return x>=0&&x<COLS&&y>=0&&y<ROWS}
function key(x,y){return x+","+y}

function buildLevel(){
 map=Array.from({length:ROWS},()=>Array(COLS).fill(0));
 for(let y=0;y<ROWS;y++) for(let x=0;x<COLS;x++){
   if(x===0||y===0||x===COLS-1||y===ROWS-1) map[y][x]=2;
   else if(x%2===0&&y%2===0) map[y][x]=2;
 }
 let blocks=Math.min(28+level*3,55);
 let safe=new Set(["1,1","1,2","2,1","2,2","11,7","11,6","10,7"]);
 while(blocks>0){
   let x=1+Math.floor(Math.random()*(COLS-2)),y=1+Math.floor(Math.random()*(ROWS-2));
   if(map[y][x]===0&&!safe.has(key(x,y))){map[y][x]=1;blocks--}
 }
 player={x:1,y:1,inv:0};
 portal={x:COLS-2,y:ROWS-2,open:false};
 enemies=[];
 const count=Math.min(2+Math.floor((level-1)/2),7);
 let tries=0;
 while(enemies.length<count&&tries++<500){
   let x=1+Math.floor(Math.random()*(COLS-2)),y=1+Math.floor(Math.random()*(ROWS-2));
   if(map[y][x]===0 && (Math.abs(x-player.x)+Math.abs(y-player.y)>7) &&
      !enemies.some(e=>e.x===x&&e.y===y) && !(x===portal.x&&y===portal.y)){
      enemies.push({x,y,dx:0,dy:0,t:0,speed:level>=6?0.7:0.5});
   }
 }
 bombs=[];powers=[];bombsActive=0;
 gameState="playing";
 msg("Level "+level+" — kalahkan semua musuh!");
 updateUI();
}

function msg(t){document.getElementById("message").textContent=t}
function updateUI(){
 livesEl.textContent=lives;bombsEl.textContent=maxBombs-bombsActive;
 radiusEl.textContent=radius;scoreEl.textContent=score;levelEl.textContent=level;
}
const livesEl=document.getElementById("lives"),bombsEl=document.getElementById("bombs"),
radiusEl=document.getElementById("radius"),scoreEl=document.getElementById("score"),levelEl=document.getElementById("level");

function canWalk(x,y){
 return cell(x,y)&&map[y][x]===0&&!bombs.some(b=>b.x===x&&b.y===y&&!b.exploded);
}
function move(dx,dy){
 if(gameState!=="playing")return;
 const nx=player.x+dx,ny=player.y+dy;
 if(canWalk(nx,ny)){player.x=nx;player.y=ny}
 checkPortal(); updateUI();
}
function plantBomb(){
 if(gameState!=="playing"||bombsActive>=maxBombs)return;
 if(bombs.some(b=>b.x===player.x&&b.y===player.y))return;
 bombs.push({x:player.x,y:player.y,t:1800,range:radius,exploded:false});
 bombsActive++;updateUI();
}
function explosionCells(b){
 const cells=[[b.x,b.y]];
 for(const [dx,dy] of dirs){
   for(let i=1;i<=b.range;i++){
     const x=b.x+dx*i,y=b.y+dy*i;if(!cell(x,y))break;
     if(map[y][x]===2)break;
     cells.push([x,y]);
     if(map[y][x]===1)break;
   }
 }
 return cells;
}
function explode(b){
 if(b.exploded)return;
 b.exploded=true;bombsActive=Math.max(0,bombsActive-1);
 const cells=explosionCells(b);
 cells.forEach(([x,y])=>{
   if(map[y][x]===1){
     map[y][x]=0;score+=10;
     if(Math.random()<0.25){
       powers.push({x,y,type:Math.random()<0.5?"range":"bomb"});
     }
   }
   for(let i=enemies.length-1;i>=0;i--){
     if(enemies[i].x===x&&enemies[i].y===y){enemies.splice(i,1);score+=100}
   }
   if(player.x===x&&player.y===y&&player.inv<=0) hurt();
   for(const other of bombs){
     if(other!==b&&!other.exploded&&other.x===x&&other.y===y) other.t=0;
   }
 });
 setTimeout(()=>{bombs=bombs.filter(q=>q!==b)},220);
 if(enemies.length===0){portal.open=true;msg("Semua musuh kalah! Cari portal hijau.");}
 updateUI();
}
function hurt(){
 lives--;player.inv=1500;score=Math.max(0,score-50);
 if(lives<=0){gameState="gameover";msg("GAME OVER — tekan R atau tombol Ulang.")}
 else {player.x=1;player.y=1;msg("Aduh! Kamu terkena ledakan.")}
 updateUI();
}

function enemyMove(e,dt){
 e.t-=dt;if(e.t>0)return;
 e.t=700+Math.random()*600;
 let options=dirs.filter(([dx,dy])=>canWalk(e.x+dx,e.y+dy));
 if(options.length){
   options.sort(()=>Math.random()-0.5);
   // Sesekali mengejar pemain
   if(Math.random()<0.45){
     options.sort((a,b)=>
       (Math.abs(e.x+a[0]-player.x)+Math.abs(e.y+a[1]-player.y))-
       (Math.abs(e.x+b[0]-player.x)+Math.abs(e.y+b[1]-player.y)));
   }
   let [dx,dy]=options[0];e.x+=dx;e.y+=dy;
 }
 if(e.x===player.x&&e.y===player.y&&player.inv<=0)hurt();
}

function checkPortal(){
 if(portal.open&&player.x===portal.x&&player.y===portal.y){
   if(level>=10){gameState="win";msg("🏆 KAMU MENANG! Blast Rush Champion!")}
   else {level++;score+=500;buildLevel()}
 }
 for(let i=powers.length-1;i>=0;i--){
   let p=powers[i];
   if(p.x===player.x&&p.y===player.y){
     if(p.type==="range")radius=Math.min(5,radius+1);
     else maxBombs=Math.min(4,maxBombs+1);
     score+=50;powers.splice(i,1);
     msg(p.type==="range"?"💥 Radius bom bertambah!":"💣 Jumlah bom bertambah!");
   }
 }
}

function restart(){
 level=1;lives=3;score=0;radius=1;maxBombs=1;buildLevel();
}
function draw(){
 ctx.clearRect(0,0,canvas.width,canvas.height);
 ctx.fillStyle="#10182c";ctx.fillRect(0,0,canvas.width,canvas.height);
 // arena
 for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
   let px=OX+x*TILE,py=OY+y*TILE;
   ctx.fillStyle=(x+y)%2?"#1c2940":"#202f49";ctx.fillRect(px,py,TILE,TILE);
   if(map[y][x]===2){ctx.fillStyle="#3d4b66";ctx.fillRect(px+2,py+2,TILE-4,TILE-4);ctx.fillStyle="#53647f";ctx.fillRect(px+6,py+6,TILE-12,7)}
   if(map[y][x]===1){ctx.fillStyle="#9b5a35";ctx.fillRect(px+3,py+3,TILE-6,TILE-6);ctx.fillStyle="#c47a45";ctx.fillRect(px+7,py+7,TILE-14,6)}
 }
 // portal
 if(portal.open){ctx.fillStyle="#3cff88";ctx.beginPath();ctx.arc(OX+portal.x*TILE+20,OY+portal.y*TILE+20,14+Math.sin(Date.now()/150)*3,0,Math.PI*2);ctx.fill()}
 else {ctx.fillStyle="#42506b";ctx.fillRect(OX+portal.x*TILE+8,OY+portal.y*TILE+8,24,24)}
 // powerups
 powers.forEach(p=>{
   ctx.fillStyle=p.type==="range"?"#ff6b9a":"#4de1ff";
   ctx.beginPath();ctx.arc(OX+p.x*TILE+20,OY+p.y*TILE+20,10,0,Math.PI*2);ctx.fill();
   ctx.fillStyle="#08101d";ctx.font="bold 13px Arial";ctx.textAlign="center";ctx.textBaseline="middle";
   ctx.fillText(p.type==="range"?"R":"B",OX+p.x*TILE+20,OY+p.y*TILE+20);
 });
 // bombs
 bombs.forEach(b=>{
   ctx.fillStyle="#111";ctx.beginPath();ctx.arc(OX+b.x*TILE+20,OY+b.y*TILE+23,12,0,Math.PI*2);ctx.fill();
   ctx.fillStyle="#ffb52e";ctx.fillRect(OX+b.x*TILE+18,OY+b.y*TILE+7,4,8);
 });
 // enemies
 enemies.forEach((e,i)=>{
   ctx.fillStyle="#e94b4b";ctx.beginPath();ctx.arc(OX+e.x*TILE+20,OY+e.y*TILE+21,14,0,Math.PI*2);ctx.fill();
   ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(OX+e.x*TILE+15,OY+e.y*TILE+18,4,0,Math.PI*2);ctx.arc(OX+e.x*TILE+25,OY+e.y*TILE+18,4,0,Math.PI*2);ctx.fill();
   ctx.fillStyle="#111";ctx.beginPath();ctx.arc(OX+e.x*TILE+15,OY+e.y*TILE+18,2,0,Math.PI*2);ctx.arc(OX+e.x*TILE+25,OY+e.y*TILE+18,2,0,Math.PI*2);ctx.fill();
 });
 // player
 if(player.inv<=0||Math.floor(player.inv/100)%2===0){
   ctx.fillStyle="#4da3ff";ctx.beginPath();ctx.arc(OX+player.x*TILE+20,OY+player.y*TILE+20,14,0,Math.PI*2);ctx.fill();
   ctx.fillStyle="#fff";ctx.fillRect(OX+player.x*TILE+11,OY+player.y*TILE+12,18,7);
   ctx.fillStyle="#111";ctx.beginPath();ctx.arc(OX+player.x*TILE+16,OY+player.y*TILE+15,2,0,Math.PI*2);ctx.arc(OX+player.x*TILE+24,OY+player.y*TILE+15,2,0,Math.PI*2);ctx.fill();
 }
 if(gameState!=="playing"){
   ctx.fillStyle="#000b";ctx.fillRect(0,0,canvas.width,canvas.height);
   ctx.fillStyle="#fff";ctx.font="bold 42px Arial";ctx.textAlign="center";
   ctx.fillText(gameState==="win"?"YOU WIN!":"GAME OVER",canvas.width/2,canvas.height/2-10);
   ctx.font="20px Arial";ctx.fillText(gameState==="win"?"Blast Rush Champion!":"Tekan R untuk mencoba lagi",canvas.width/2,canvas.height/2+30);
 }
}

function loop(t){
 let dt=t-last;last=t;
 if(gameState==="playing"){
   bombs.forEach(b=>{b.t-=dt;if(b.t<=0)explode(b)});
   if(player.inv>0)player.inv-=dt;
   enemies.forEach(e=>enemyMove(e,dt));
   checkPortal();
 }
 draw();requestAnimationFrame(loop);
}
document.addEventListener("keydown",e=>{
 if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key))e.preventDefault();
 if(e.key==="ArrowUp"||e.key.toLowerCase()==="w")move(0,-1);
 if(e.key==="ArrowDown"||e.key.toLowerCase()==="s")move(0,1);
 if(e.key==="ArrowLeft"||e.key.toLowerCase()==="a")move(-1,0);
 if(e.key==="ArrowRight"||e.key.toLowerCase()==="d")move(1,0);
 if(e.key===" ")plantBomb();
 if(e.key.toLowerCase()==="r")restart();
});
restart();requestAnimationFrame(loop);
</script>
</body>
</html>
